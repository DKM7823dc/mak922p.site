<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按钮跳转示例 - Facebook 事件跟踪</title>
</head>
<body>
    <!-- 您的按钮 -->
    <button onclick="k2()">点击我</button>

    <!-- 1. 加载 Facebook Pixel SDK -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        // 2. 初始化 Pixel（请将 'YOUR_PIXEL_ID' 替换为您的真实像素ID）
        fbq('init', '10004845186306323');
        fbq('track', 'PageView');  // 可选：跟踪页面浏览
    </script>

    <!-- 3. 核心函数 k2 -->
    <script>
        function k2() {

            // 发送自定义事件“下载”（推荐使用 trackCustom）
            fbq('trackCustom', '下载');

            // 延迟跳转，确保事件有机会发送成功
            setTimeout(function() {
                window.location.href = 'https://www.qq.com';
            }, 5030);   // 延迟 500 毫秒，可根据情况调整
        }
    </script>

    <!-- 可选：显示提醒，便于调试 -->
    <p style="margin-top:20px;color:#888;">点击按钮会触发事件并跳转到 QQ 首页</p>
</body>
</html>
